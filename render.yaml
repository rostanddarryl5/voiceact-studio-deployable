services:
  - type: web
    name: voiceact-analysis
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.analysis
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: VOICEACT_INTERNAL_TOKEN
        sync: false
      - key: VOICEACT_MODEL_SIZE
        value: tiny
      - key: VOICEACT_DEVICE
        value: cpu
      - key: VOICEACT_COMPUTE_TYPE
        value: int8
      - key: VOICEACT_ALIGNMENT
        value: mfa
      - key: VOICEACT_PHONEME_SERVICE_URL
        value: http://127.0.0.1:8020
      - key: VOICEACT_PHONEME_TIMEOUT_SECONDS
        value: "20"
      - key: VOICEACT_MAX_CONCURRENCY
        value: "1"
      - key: VOICEACT_PRELOAD_MODEL
        value: "false"
      - key: VOICEACT_MAX_UPLOAD_MB
        value: "24"
      - key: HF_HOME
        value: /models/huggingface
      - key: XDG_CACHE_HOME
        value: /models/cache
      - key: TORCH_HOME
        value: /models/torch
      - key: MFA_ROOT_DIR
        value: /models
